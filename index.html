<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบโรงเรียนชุมชนบึงบา</title>
<meta name="description" content="ระบบงานวิชาการ โรงเรียนชุมชนบึงบา">
<meta name="theme-color" content="#6B47A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บึงบา">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* สีโรงเรียน: ม่วง + เหลืองทอง */
  :root { --ac: #6B47A6; --gold: #F0C850; --bg: #F7F4FB; --ink: #1F1A2E; --mut: #5F5873; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ac); font-family: 'IBM Plex Sans Thai', 'Sarabun', 'Leelawadee UI', Tahoma, sans-serif; color: var(--ink); overflow: hidden; }
  /* เว้นขอบให้พอดีจอที่มีรอยบาก/แถบล่าง (iPhone) */
  #top { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--ac); z-index: 3; }
  #app { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; background: var(--bg); }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom, 0px); background: #fff; z-index: 3; }
  #splash { position: fixed; inset: 0; z-index: 5; background: linear-gradient(160deg, #7E5BB5 0%, #9B7CC9 60%, #B99AD3 100%); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; transition: opacity .35s; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 136px; height: 136px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px var(--gold), 0 10px 30px rgba(40, 20, 80, .35); }
  #splash h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
  #splash p { margin: 0; opacity: .9; font-size: 14px; }
  .dots { display: flex; gap: 6px; margin-top: 6px; } .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--gold); animation: b 1s infinite ease-in-out; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
  #msg { display: none; background: #fff; color: var(--ink); border-radius: 16px; padding: 16px; max-width: 340px; font-size: 14px; line-height: 1.55; }
  #msg b { display: block; font-size: 16px; margin-bottom: 4px; }
  #msg button, #msg a { display: block; width: 100%; margin-top: 10px; min-height: 46px; border: 0; border-radius: 12px; background: var(--ac); color: #fff; font: inherit; font-weight: 600; text-decoration: none; line-height: 46px; cursor: pointer; }
  #msg a { background: #EDE4F8; color: #462A78; }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; } #splash { transition: none; } }
</style>
</head>
<body>
<div id="top"></div>
<iframe id="app" title="ระบบโรงเรียนชุมชนบึงบา" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="bottom"></div>
<div id="splash" role="status" aria-live="polite">
  <img src="logo.png" alt="ตราโรงเรียนชุมชนบึงบา">
  <h1>ระบบโรงเรียนชุมชนบึงบา</h1>
  <p id="sub">กำลังเปิด…</p>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="msg"></div>
</div>
<script src="push-config.js"></script>
<div id="pushSheet" style="display:none;position:fixed;inset:0;z-index:9;background:rgba(30,20,50,.55);align-items:flex-end;justify-content:center">
  <div style="background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;font-size:15px;line-height:1.55">
    <b style="font-size:18px;display:block;margin-bottom:6px">🔔 เปิดการแจ้งเตือน</b>
    <div id="pushTx">เมื่อมีสอนแทน คำสั่งใหม่ที่มีชื่อคุณ เรื่องรออนุมัติ หรือแจ้งซ่อม มือถือจะเด้งแจ้งเตือนและมีตัวเลขที่ไอคอนแอป</div>
    <button type="button" id="pushYes" style="display:block;width:100%;margin-top:14px;min-height:48px;border:0;border-radius:12px;background:#6B47A6;color:#fff;font:inherit;font-weight:700">อนุญาตการแจ้งเตือน</button>
    <button type="button" id="pushNo" style="display:block;width:100%;margin-top:8px;min-height:44px;border:0;border-radius:12px;background:#EDE4F8;color:#462A78;font:inherit;font-weight:700">ไว้ทีหลัง</button>
  </div>
</div>
<script>
/* ===== ตั้งค่า: ลิงก์เว็บแอปของระบบโรงเรียน (Apps Script → Deploy → ลิงก์ที่ลงท้ายด้วย /exec) =====
 * ถ้า Deploy ใหม่จนลิงก์เปลี่ยน ให้แก้บรรทัดนี้บรรทัดเดียว */
var APP_URL = 'https://script.google.com/macros/s/AKfycbxe8ambv6GYT-HCDM8JVh90kn5P5rTD0QATdHtQj6A1CZEbsdAgm-K_ppMISi37qdcBmw/exec';

(function () {
  var frame = document.getElementById('app'), splash = document.getElementById('splash'), msg = document.getElementById('msg');
  var goP = ''; try { goP = new URL(location.href).searchParams.get('go') || ''; } catch (x) { }   // แตะแจ้งเตือน → เปิดหน้าที่เกี่ยวข้อง
  var src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'app=1' + (goP ? '&go=' + encodeURIComponent(goP) : '');
  var done = false, slow = null;
  function show(html) {
    document.getElementById('dots').style.display = 'none'; document.getElementById('sub').style.display = 'none';
    msg.innerHTML = html; msg.style.display = 'block'; splash.classList.remove('hide');
  }
  function offline() {
    show('<b>ไม่มีอินเทอร์เน็ต</b>ตรวจสอบ Wi-Fi หรืออินเทอร์เน็ตมือถือ แล้วลองใหม่<button type="button" id="retry">ลองใหม่</button>');
    document.getElementById('retry').onclick = function () { location.reload(); };
  }
  function open() {
    if (!navigator.onLine) return offline();
    frame.src = src;
    slow = setTimeout(function () {
      if (done) return;
      show('<b>เปิดช้ากว่าปกติ</b>อินเทอร์เน็ตอาจช้า รอสักครู่ หรือเปิดในเบราว์เซอร์แทน<button type="button" id="wait">รอต่อ</button><a href="' + APP_URL + '" target="_blank" rel="noopener">เปิดในเบราว์เซอร์</a>');
      document.getElementById('wait').onclick = function () { msg.style.display = 'none'; document.getElementById('dots').style.display = ''; };
    }, 20000);
  }
  frame.addEventListener('load', function () {
    if (!frame.getAttribute('src')) return;
    done = true; clearTimeout(slow);
    setTimeout(function () { splash.classList.add('hide'); }, 250);
  });
  window.addEventListener('offline', function () { if (!done) offline(); });
  window.addEventListener('online', function () { if (!done) location.reload(); });
  /* v1.12.0 เก็บการเข้าสู่ระบบไว้ที่หน้านี้ด้วย (iPhone ล้างข้อมูลในกรอบด้านในบ่อย แต่ไม่ล้างของหน้าแอปบนหน้าจอโฮม)
   * รับคำขอเฉพาะจากหน้าเว็บแอปของ Google ที่อยู่ "ข้างใน" หน้านี้เท่านั้น */
  var TK_KEY = 'bb_token';
  function lsGet() { try { return localStorage.getItem(TK_KEY) || ''; } catch (x) { return ''; } }
  function lsSet(v) { try { if (v) localStorage.setItem(TK_KEY, v); else localStorage.removeItem(TK_KEY); } catch (x) { } }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.bb !== 'tok' || window.top !== window) return;
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    try { if (!e.source || e.source.top !== window) return; } catch (x) { return; }
    if (d.op === 'get') e.source.postMessage({ bb: 'tok-reply', token: lsGet() }, e.origin);
    else if (d.op === 'set' && /^[\w-]+\|\d+\|[0-9a-f]+$/.test(String(d.token || ''))) lsSet(String(d.token));
    else if (d.op === 'clear') lsSet('');
  });
  /* ===== v1.14.0 แจ้งเตือนเด้ง + ตัวเลขที่ไอคอน (Firebase Cloud Messaging) =====
   * หน้าระบบโรงเรียน (กรอบด้านใน) ขอผ่าน postMessage → หน้านี้ (หน้าแอปบนหน้าจอโฮม) เป็นคนขอสิทธิ์/รับ token
   * เพราะมือถือให้ขอสิทธิ์แจ้งเตือนได้จากหน้าบนสุดเท่านั้น */
  var appWin = null, appOrigin = '';
  var CFG = window.PUSH_CONFIG || {};
  var configured = !!(CFG.apiKey && CFG.projectId && CFG.messagingSenderId && CFG.appId && CFG.vapidKey);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  function toApp(m) { if (appWin) try { appWin.postMessage(m, appOrigin); } catch (x) { } }
  function pushState() { return { bb: 'push-status', supported: supported, configured: configured, standalone: standalone, ios: ios, permission: supported ? Notification.permission : 'unsupported' }; }
  function loadJs(u) { return new Promise(function (ok, bad) { var s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = function () { bad(new Error('โหลดไม่สำเร็จ ' + u)); }; document.head.appendChild(s); }); }
  var FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
  function fbToken() {
    return (window.firebase && firebase.messaging ? Promise.resolve() : loadJs(FB + 'firebase-app-compat.js').then(function () { return loadJs(FB + 'firebase-messaging-compat.js'); }))
      .then(function () { if (!firebase.apps.length) firebase.initializeApp(CFG); return navigator.serviceWorker.ready; })
      .then(function (reg) { return firebase.messaging().getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg }); });
  }
  function sendToken() {
    fbToken().then(function (t) { if (t) toApp({ bb: 'push-token', token: t, device: (ios ? 'iPhone/iPad' : /Android/.test(navigator.userAgent) ? 'Android' : 'คอมพิวเตอร์') }); })
      .catch(function (e) { toApp({ bb: 'push-error', msg: String(e && e.message || e) }); });
  }
  /* ตัวเลขที่ไอคอน: เก็บใน IndexedDB ให้ตัวช่วย (sw.js) บวกเพิ่มตอนแจ้งเตือนเข้า */
  function idb(fn) { try { var r = indexedDB.open('bb-app', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { try { fn(r.result.transaction('kv', 'readwrite').objectStore('kv')); } catch (x) { } }; } catch (x) { } }
  function setBadge(n) {
    n = Math.max(0, +n || 0);
    idb(function (st) { st.put(n, 'badge'); });
    try { if (n && navigator.setAppBadge) navigator.setAppBadge(n); else if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (x) { }
  }
  var sheet = document.getElementById('pushSheet');
  document.getElementById('pushNo').onclick = function () { sheet.style.display = 'none'; };
  document.getElementById('pushYes').onclick = function () {
    sheet.style.display = 'none';
    Notification.requestPermission().then(function (p) {   // ต้องเรียกจากการแตะบนหน้านี้โดยตรง
      toApp(pushState());
      if (p === 'granted') sendToken();
    });
  };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || (d.bb !== 'push' && d.bb !== 'tok') || window.top !== window) return;
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    try { if (!e.source || e.source.top !== window) return; } catch (x) { return; }
    appWin = e.source; appOrigin = e.origin;
    if (d.bb !== 'push') return;
    if (d.op === 'status') toApp(pushState());
    else if (d.op === 'enable') {
      if (!supported || !configured) return toApp(pushState());
      if (Notification.permission === 'granted') return sendToken();
      if (Notification.permission === 'denied') return toApp(pushState());
      sheet.style.display = 'flex';
    }
    else if (d.op === 'refresh' && supported && configured && Notification.permission === 'granted') sendToken();
    else if (d.op === 'badge') setBadge(d.n);
  });
  /* แตะแจ้งเตือนตอนแอปเปิดอยู่ → sw.js ส่งมาบอก → ให้หน้าระบบไปหน้าที่เกี่ยวข้อง */
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.bb === 'go') toApp({ bb: 'go', link: e.data.link }); });
  open();
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); }); }
})();
</script>
</body>
</html>
